<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record Expense — OVC1110</title>
    <link rel="icon" href="/gp.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --gp-green: #1a472a;
        --gp-green-light: #2d6a4f;
        --gp-cream: #f0f4f1;
        --gp-white: #ffffff;
        --gp-red: #b91c1c;
        --gp-text: #1f2937;
        --gp-muted: #6b7280;
        --gp-border: #d1d5db;
        --gp-shadow: 0 4px 24px rgba(26, 71, 42, 0.08);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--gp-cream);
        color: var(--gp-text);
        line-height: 1.6;
        min-height: 100vh;
      }

      .header {
        background: var(--gp-green);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .header img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      .header-text h1 {
        color: var(--gp-white);
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .header-text p {
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.75rem;
        font-weight: 400;
      }

      .container {
        max-width: 640px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--gp-green-light);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 20px;
      }
      .back:hover {
        text-decoration: underline;
      }

      .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--gp-green);
        margin-bottom: 24px;
      }

      .card {
        background: var(--gp-white);
        border-radius: 16px;
        padding: 28px;
        box-shadow: var(--gp-shadow);
        border: 1px solid #e5e7eb;
      }

      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gp-text);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 14px 16px;
        font-size: 1rem;
        border: 1.5px solid var(--gp-border);
        border-radius: 10px;
        background: #fafbfb;
        color: var(--gp-text);
        font-family: inherit;
        transition: all 0.2s ease;
      }
      input:focus {
        outline: none;
        border-color: var(--gp-green-light);
        background: var(--gp-white);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
      }

      .btn {
        width: 100%;
        padding: 16px;
        margin-top: 8px;
        font-size: 1rem;
        font-weight: 600;
        color: var(--gp-white);
        background: var(--gp-green);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s ease;
        letter-spacing: 0.3px;
      }
      .btn:hover {
        background: var(--gp-green-light);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .msg {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        display: none;
        align-items: center;
        gap: 8px;
      }
      .msg.show {
        display: flex;
      }
      .msg.success {
        background: #dcfce7;
        color: #166534;
        border: 1px solid #bbf7d0;
      }
      .msg.error {
        background: #fee2e2;
        color: var(--gp-red);
        border: 1px solid #fecaca;
      }

      @media (max-width: 480px) {
        .header img {
          width: 40px;
          height: 40px;
        }
        .header-text h1 {
          font-size: 1rem;
        }
        .card {
          padding: 22px;
          border-radius: 14px;
        }
        .page-title {
          font-size: 1.3rem;
        }
        input {
          padding: 16px;
          font-size: 16px;
        }
        .btn {
          padding: 18px;
          font-size: 1.05rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="/gp.png" alt="OVC1110 Logo" />
      <div class="header-text">
        <h1>Greenpeace OVC1110</h1>
        <p>Helping Orphans & Vulnerable Children Escape Poverty</p>
      </div>
    </header>

    <main class="container">
      <a href="/" class="back">← Back to Portal</a>
      <h2 class="page-title">Record Expense</h2>

      <div class="card">
        <form id="expenseForm">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>

          <div class="form-group">
            <label for="item">Item / Description</label>
            <input
              type="text"
              id="item"
              placeholder="e.g. Money for Gas"
              required
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount (₦)</label>
            <input type="number" id="amount" placeholder="" required />
          </div>

          <div class="form-group">
            <label for="approvedBy">Approved By</label>
            <input type="text" id="approvedBy" placeholder="" required />
          </div>

          <button type="submit" class="btn" id="btn">Save Expense</button>
          <div id="msg" class="msg"></div>
        </form>
      </div>
    </main>

    <script>
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "/login.html";

      document
        .getElementById("expenseForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btn");
          const msg = document.getElementById("msg");
          btn.disabled = true;
          msg.className = "msg";

          const body = {
            date: document.getElementById("date").value,
            item: document.getElementById("item").value.trim(),
            amount: Number(document.getElementById("amount").value),
            approvedBy: document.getElementById("approvedBy").value.trim(),
          };

          try {
            const res = await fetch("/api/expenses", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify(body),
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.message || "Failed to save");

            msg.className = "msg success show";
            msg.textContent = "✓ Expense saved successfully";
            document.getElementById("expenseForm").reset();
          } catch (err) {
            msg.className = "msg error show";
            msg.textContent = "✗ " + err.message;
          } finally {
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
