<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVC1110 - Add Student</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      input,
      select {
        padding: 8px;
        font-size: 16px;
      }
      button {
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      #message {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Register New Student</h1>

    <form id="studentForm">
      <input type="text" id="fullName" placeholder="Full Name" required />
      <input type="number" id="age" placeholder="Age" required />

      <select id="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <input type="text" id="school" placeholder="School" required />
      <input
        type="text"
        id="guardianName"
        placeholder="Guardian Name"
        required
      />
      <input
        type="text"
        id="guardianPhone"
        placeholder="Guardian Phone"
        required
      />

      <button type="submit">Register Student</button>
    </form>

    <p id="message"></p>

    <script>
      const form = document.getElementById("studentForm");
      const messageEl = document.getElementById("message");

      form.addEventListener("submit", async (e) => {
        e.preventDefault(); // Stop page reload

        // 1. Gather data from the form
        const data = {
          fullName: document.getElementById("fullName").value,
          age: Number(document.getElementById("age").value),
          gender: document.getElementById("gender").value,
          school: document.getElementById("school").value,
          guardianName: document.getElementById("guardianName").value,
          guardianPhone: document.getElementById("guardianPhone").value,
          needs: [], // Empty array for now
        };

        try {
          // 2. Send POST request to your backend
          const response = await fetch("/api/students", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + localStorage.getItem("token"),
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          // 3. Handle the response
          if (response.ok) {
            messageEl.style.color = "green";
            messageEl.textContent = "Student registered successfully!";
            form.reset(); // Clear the form
          } else {
            messageEl.style.color = "red";
            messageEl.textContent = `Error: ${result.message}`;
          }
        } catch (error) {
          messageEl.style.color = "red";
          messageEl.textContent = "Server error. Please try again.";
        }
      });
    </script>
    <a
      href="/"
      style="
        display: block;
        margin-bottom: 20px;
        color: #6c757d;
        text-decoration: none;
        font-size: 0.9rem;
      "
      >← Back to Portal</a
    >
  </body>
</html>
