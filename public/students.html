<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Student</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --text: #212529;
        --muted: #6c757d;
        --border: #dee2e6;
        --accent: #495057;
        --card-bg: #ffffff;
        --success: #28a745;
        --error: #dc3545;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 40px 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        color: var(--accent);
        font-size: 1.5rem;
        margin-bottom: 24px;
      }
      .back {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        display: block;
        margin-bottom: 20px;
      }
      .back:hover {
        text-decoration: underline;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 6px;
        margin-top: 16px;
      }
      input,
      select {
        width: 100%;
        padding: 10px 12px;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-sizing: border-box;
        font-family: inherit;
      }
      button {
        width: 100%;
        padding: 12px;
        margin-top: 24px;
        font-size: 1rem;
        font-weight: 500;
        color: #fff;
        background: var(--success);
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .msg {
        margin-top: 16px;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        display: none;
      }
      .msg.error {
        background: #f8d7da;
        color: #721c24;
        display: block;
      }
      .msg.success {
        background: #d4edda;
        color: #155724;
        display: block;
      }
    </style>
  </head>
  <body>
    <a href="/" class="back">← Back to Portal</a>
    <h1>Register New Student</h1>

    <form id="studentForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required />

      <label for="age">Age</label>
      <input type="number" id="age" required />

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="school">School</label>
      <input type="text" id="school" required />

      <label for="guardianName">Guardian Name</label>
      <input type="text" id="guardianName" required />

      <label for="guardianPhone">Guardian Phone</label>
      <input type="text" id="guardianPhone" required />

      <button type="submit" id="btn">Register Student</button>
      <div id="msg" class="msg"></div>
    </form>

    <script>
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "/login.html";

      document
        .getElementById("studentForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btn");
          const msg = document.getElementById("msg");
          btn.disabled = true;
          msg.style.display = "none";

          const body = {
            fullName: document.getElementById("fullName").value,
            age: Number(document.getElementById("age").value),
            gender: document.getElementById("gender").value,
            school: document.getElementById("school").value,
            guardianName: document.getElementById("guardianName").value,
            guardianPhone: document.getElementById("guardianPhone").value,
          };

          try {
            const res = await fetch("/api/students", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify(body),
            });

            const data = await res.json();

            if (!res.ok) throw new Error(data.message || "Failed to register");

            msg.className = "msg success";
            msg.textContent = "Student registered successfully!";
            msg.style.display = "block";
            document.getElementById("studentForm").reset();
          } catch (err) {
            msg.className = "msg error";
            msg.textContent = err.message;
            msg.style.display = "block";
          } finally {
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
