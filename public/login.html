<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login — OVC1110</title>
    <link rel="icon" href="/gp.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --gp-green: #1a472a;
        --gp-green-light: #2d6a4f;
        --gp-cream: #f0f4f1;
        --gp-white: #ffffff;
        --gp-red: #b91c1c;
        --gp-text: #1f2937;
        --gp-muted: #6b7280;
        --gp-border: #d1d5db;
        --gp-shadow: 0 4px 24px rgba(26, 71, 42, 0.08);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--gp-cream);
        color: var(--gp-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-card {
        background: var(--gp-white);
        border-radius: 16px;
        padding: 36px 28px;
        width: 100%;
        max-width: 380px;
        box-shadow: var(--gp-shadow);
        border: 1px solid #e5e7eb;
      }

      .logo-wrap {
        text-align: center;
        margin-bottom: 24px;
      }
      .logo-wrap img {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--gp-cream);
      }
      .logo-wrap h1 {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--gp-green);
        margin-top: 12px;
      }
      .logo-wrap p {
        font-size: 0.85rem;
        color: var(--gp-muted);
        margin-top: 2px;
      }

      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gp-text);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 14px 16px;
        font-size: 1rem;
        border: 1.5px solid var(--gp-border);
        border-radius: 10px;
        background: #fafbfb;
        color: var(--gp-text);
        font-family: inherit;
        transition: all 0.2s ease;
      }
      input:focus {
        outline: none;
        border-color: var(--gp-green-light);
        background: var(--gp-white);
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
      }

      .btn {
        width: 100%;
        padding: 16px;
        margin-top: 6px;
        font-size: 1rem;
        font-weight: 600;
        color: var(--gp-white);
        background: var(--gp-green);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s ease;
        letter-spacing: 0.3px;
      }
      .btn:hover {
        background: var(--gp-green-light);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .msg {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        display: none;
        align-items: center;
        gap: 8px;
      }
      .msg.show {
        display: flex;
      }
      .msg.error {
        background: #fee2e2;
        color: var(--gp-red);
        border: 1px solid #fecaca;
      }

      .footer {
        text-align: center;
        margin-top: 24px;
        font-size: 0.75rem;
        color: var(--gp-muted);
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 28px 22px;
        }
        input {
          padding: 16px;
          font-size: 16px;
        } /* Prevents iOS zoom */
        .btn {
          padding: 18px;
          font-size: 1.05rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="logo-wrap">
        <img src="/gp.png" alt="OVC1110 Logo" />
        <h1>Greenpeace OVC1110</h1>
        <p>Staff Portal Login</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="amir@test.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
          />
        </div>

        <button type="submit" class="btn" id="btn">Log In</button>
        <div id="msg" class="msg"></div>
      </form>

      <p class="footer">Helping Orphans & Vulnerable Children Escape Poverty</p>
    </div>

    <script>
      if (localStorage.getItem("token")) {
        window.location.href = "/";
      }

      const form = document.getElementById("loginForm");
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "Logging in...";
        msg.className = "msg";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/api/staff/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (!res.ok) throw new Error(data.message || "Login failed");

          localStorage.setItem("token", data.data.token);
          window.location.href = "/";
        } catch (err) {
          msg.className = "msg error show";
          msg.textContent = "✗ " + err.message;
          btn.disabled = false;
          btn.textContent = "Log In";
        }
      });
    </script>
  </body>
</html>
